<title>命运转盘｜五角色幸运抽选</title>
<style>
:root{color-scheme:dark;--ink:#fbf8ff;--muted:#aaa6c3;--gold:#f3dca0;--violet:#bcb0ff}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;padding:24px 16px 32px;display:flex;justify-content:center;align-items:center;color:var(--ink);font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:radial-gradient(ellipse at 50% 0%,#352b61 0,transparent 53%),linear-gradient(145deg,#10101b,#19172b 70%,#101820)}
main{width:min(100%,900px)}
header{text-align:center;margin:0 0 26px}.kicker{font-size:11px;letter-spacing:.26em;color:var(--gold);font-weight:850}
h1{font-size:clamp(30px,5vw,43px);margin:8px 0 7px;letter-spacing:.07em}
header p{margin:0;color:var(--muted);font-size:13px}
.layout{display:grid;grid-template-columns:minmax(0,1.12fr) minmax(245px,.88fr);gap:clamp(22px,4vw,44px);align-items:center}
.wheel-wrap{position:relative;width:100%;max-width:500px;aspect-ratio:1;margin:auto;filter:drop-shadow(0 20px 35px #0007)}
.rim{position:absolute;inset:0;padding:9px;border-radius:50%;background:linear-gradient(140deg,#fff0bd,#b9a8ff 42%,#6759a8 75%,#f8dca2);box-shadow:inset 0 0 0 2px #fff8}
canvas{display:block;width:100%;height:100%;border-radius:50%}
.pointer{position:absolute;z-index:3;top:-3px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:17px solid transparent;border-right:17px solid transparent;border-top:36px solid #fff0bd;filter:drop-shadow(0 3px 4px #0008)}
.hub{position:absolute;z-index:4;left:50%;top:50%;transform:translate(-50%,-50%);width:76px;height:76px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(145deg,#fff2c9,#d2b56c);border:5px solid #fff8e8;color:#28203d;font-size:15px;font-weight:1000;letter-spacing:.12em;box-shadow:0 5px 18px #0009}
.panel{border:1px solid #ffffff18;border-radius:24px;padding:26px;background:linear-gradient(145deg,#25243dde,#191827ed);box-shadow:0 18px 50px #0003}
.panel h2{font-size:19px;margin:0 0 7px}.desc{font-size:13px;line-height:1.75;color:var(--muted);margin:0}
.people{display:flex;gap:8px;flex-wrap:wrap;margin:19px 0 23px}.chip{font-size:12px;font-weight:750;padding:7px 11px;border-radius:99px;background:#ffffff0c;border:1px solid #ffffff20;color:#f0eaff}
button{width:100%;border:0;border-radius:14px;padding:15px 16px;font-size:15px;font-weight:900;color:#211a3d;background:linear-gradient(100deg,#fff0bd,#c8baff);box-shadow:0 8px 25px #9a8cff28;cursor:pointer;transition:transform .18s,filter .18s}
button:hover{filter:brightness(1.06);transform:translateY(-1px)}button:disabled{opacity:.72;cursor:wait}
.result{margin-top:16px;padding:15px 16px;border-radius:14px;background:#11111f;border:1px solid #ffffff14;min-height:87px}
.label{font-size:10px;letter-spacing:.18em;color:#aaa5c8;font-weight:850}.outcome{font-size:25px;font-weight:950;margin-top:5px;letter-spacing:.04em}.outcome.win{color:#d9ccff}
.note{font-size:11px!important;color:#8d89a7!important;margin-top:14px!important}
@media(max-width:680px){body{align-items:flex-start;padding-top:25px}.layout{grid-template-columns:1fr;gap:24px}.wheel-wrap{max-width:min(88vw,420px)}.panel{padding:22px;max-width:490px;width:100%;margin:auto}header{margin-bottom:22px}.hub{width:65px;height:65px;font-size:13px}}
</style>
</head>

const imgs=sources.map(src=>{const im=new Image();im.src=src;return im});
const canvas=document.getElementById('wheel'),ctx=canvas.getContext('2d'),C=500,R=478,slice=2*Math.PI/names.length;
let angle=-Math.PI/2,spinning=false;
function draw(){
 ctx.clearRect(0,0,1000,1000);ctx.save();ctx.translate(C,C);
 for(let i=0;i<names.length;i++){
  const start=angle+i*slice,end=start+slice,mid=start+slice/2;
  ctx.save();ctx.beginPath();ctx.moveTo(0,0);ctx.arc(0,0,R,start,end);ctx.closePath();ctx.clip();
  // Each image is individually cropped around its character's head/upper body before embedding.
  if(imgs[i].complete&&imgs[i].naturalWidth){ctx.save();ctx.rotate(mid);ctx.drawImage(imgs[i],-R*.99,-R*.99,R*1.98,R*1.98);ctx.restore()}
  else{ctx.fillStyle='#333';ctx.fillRect(-R,-R,R*2,R*2)}
  const shade=ctx.createLinearGradient(-R,-R,R,R);shade.addColorStop(0,'rgba(9,8,22,.10)');shade.addColorStop(1,'rgba(9,8,22,.38)');ctx.fillStyle=shade;ctx.fillRect(-R,-R,R*2,R*2);
  ctx.restore();
  ctx.beginPath();ctx.moveTo(0,0);ctx.arc(0,0,R,start,end);ctx.closePath();ctx.strokeStyle='rgba(255,242,208,.96)';ctx.lineWidth=5;ctx.stroke();
  ctx.save();ctx.rotate(mid);ctx.textAlign='right';ctx.textBaseline='middle';ctx.font='900 43px "PingFang SC","Microsoft YaHei",sans-serif';ctx.lineJoin='round';ctx.lineWidth=8;ctx.strokeStyle='rgba(12,9,28,.85)';ctx.strokeText(names[i],R-39,0);ctx.fillStyle='#fff8e8';ctx.fillText(names[i],R-39,0);ctx.restore();
 }
 ctx.beginPath();ctx.arc(0,0,R,0,Math.PI*2);ctx.strokeStyle='#fff0c7';ctx.lineWidth=10;ctx.stroke();ctx.restore();
}
imgs.forEach(im=>im.onload=draw);draw();
function chosen(){let a=((-Math.PI/2-angle)%(2*Math.PI)+2*Math.PI)%(2*Math.PI);return names[Math.floor(a/slice)%names.length]}
document.getElementById('spin').addEventListener('click',()=>{if(spinning)return;spinning=true;const btn=document.getElementById('spin'),out=document.getElementById('result');btn.disabled=true;btn.textContent='好运转动中…';out.classList.remove('win');out.textContent='正在揭晓';const initial=angle,extra=2*Math.PI*(7+Math.random()*3)+Math.random()*2*Math.PI,duration=4400+Math.random()*500,start=performance.now();function frame(now){const t=Math.min(1,(now-start)/duration),ease=1-Math.pow(1-t,4);angle=initial+extra*ease;draw();if(t<1)requestAnimationFrame(frame);else{spinning=false;btn.disabled=false;btn.textContent='再转一次　↗';out.textContent=chosen();out.classList.add('win')}}requestAnimationFrame(frame)});
</script></body></html>
